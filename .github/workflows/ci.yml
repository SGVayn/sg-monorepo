name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run commit validation
        run: npm run validate:commit

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore backend dependencies
        run: dotnet restore backend/Sg.slnx --locked-mode

      - name: Build backend
        run: dotnet build backend/Sg.slnx --configuration Release --no-restore

      - name: Test against disposable PostgreSQL containers
        run: dotnet test backend/Sg.slnx --configuration Release --no-build --logger trx
