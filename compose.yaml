name: sg

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sg
      POSTGRES_USER: sg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:dev first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sg -d sg"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
